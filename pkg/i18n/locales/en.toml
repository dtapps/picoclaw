description = "Success judge system prompt"
other = "Return exactly one JSON object with fields success:boolean and reason:string. No markdown fences."

[success_judge_prompt]
description = "Success judge prompt"
other = """Decide whether this agent task truly achieved the user's goal.
Reject tasks that are only partial reasoning, only describe future steps, or obviously did not complete the requested outcome.
Accept completed custom workspace skill/theorem tasks when the final output gives a concrete result or concrete completed procedure.

Summary: {{.Summary}}
Final output: {{.FinalOutput}}
Used skills: {{.UsedSkillNames}}"""

[success_judge_none]
description = "Success judge none fallback"
other = "none"

[leaf_summary_prompt]
description = "Leaf summary prompt"
other = """You summarize a SEGMENT of a conversation for future model turns.
Treat this as incremental memory compaction input, not a full-conversation summary.

Normal summary policy:
- Preserve key decisions, rationale, constraints, and active tasks.
- Keep essential technical details needed to continue work safely.
- Remove obvious repetition and conversational filler.

Output requirements:
- Plain text only.
- No preamble, headings, or markdown formatting.
- Track file operations (created, modified, deleted, renamed) with file paths and current status.
- If no file operations appear, include exactly: "Files: none".
- End with exactly: "Expand for details about: <comma-separated list of what was dropped or compressed>".
- Target length: about {{.TargetTokens}} tokens or less.

<previous_context>
{{.Prev}}
</previous_context>

<conversation_segment>
{{.SourceText}}
</conversation_segment>"""

[condensed_summary_prompt]
description = "Condensed summary prompt"
other = """You condense multiple summaries into a single higher-level summary.
Preserve all important decisions, constraints, and outcomes.
Merge overlapping topics. Keep technical details intact.

Output requirements:
- Plain text only.
- No preamble, headings, or markdown formatting.
- End with exactly: "Expand for details about: <comma-separated list>".
- Target length: about {{.TargetTokens}} tokens or less.

<summaries>
{{.SourceText}}
</summaries>"""

[aggressive_leaf_summary_prompt]
description = "Aggressive leaf summary prompt"
other = """You summarize a SEGMENT of a conversation for future model turns.
Aggressive summary policy:
- Keep only durable facts and current task state.
- Remove examples, repetition, and low-value narrative details.
- Preserve explicit TODOs, blockers, decisions, and constraints.

Output requirements:
- Plain text only.
- No preamble, headings, or markdown formatting.
- Track file operations (created, modified, deleted, renamed) with file paths and current status.
- If no file operations appear, include exactly: "Files: none".
- End with exactly: "Expand for details about: <comma-separated list of what was dropped or compressed>".
- Target length: about {{.TargetTokens}} tokens or less.

<previous_context>
{{.Prev}}
</previous_context>

<conversation_segment>
{{.SourceText}}
</conversation_segment>"""

[skill_draft_instructions]
description = "Skill draft instructions"
other = """body_or_patch must contain the complete draft body or patch content as plain text.
body_or_patch is an internal draft and review artifact, so it may include concise learning provenance, source task evidence, and source skill summaries when useful for human review.
If change_kind is create, body_or_patch must be a complete SKILL.md file with exactly two parts: YAML frontmatter and a Markdown body.
The YAML frontmatter must contain only name and description fields.
The description field must and only describe what this skill can do and when to use it.
The deployable Markdown body should only contain what the skill is useful for and how to use it.
The Markdown body is loaded only after the skill triggers, so focus on concise usage guidance and the execution steps needed to complete the task.
When describing an operation process in the body, do not use vague summaries; provide detailed step-by-step instructions for the exact operation or execution process.
When creating a combined shortcut skill, summarize the functional purpose and result of the provided SKILL.md inputs; do not copy or directly include other skills' instructions.
Extract only the necessary operations from source skills and evidence, such as formulas, ordered transformations, commands, inputs, outputs, and boundary conditions.
The operational part of the generated skill must be directly usable by a future agent without reading the original task records or source skills.
Keep operational instructions separable from audit/provenance notes because the final deployed SKILL.md will be rendered without learning traces."""

