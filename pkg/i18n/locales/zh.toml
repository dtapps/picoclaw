[skill_draft_instructions]
description = "技能草稿说明"
other = """body_or_patch 必须包含完整的草稿正文或补丁内容，格式为纯文本。
body_or_patch 是内部草稿和审查工件，因此在有助于人工审查时可以包含简洁的学习来源、源任务证据和源技能摘要。
如果 change_kind 是 create，body_or_patch 必须是完整的 SKILL.md 文件，包含两个部分：YAML frontmatter 和 Markdown body。
YAML frontmatter 必须只包含 name 和 description 字段。
description 字段必须且只能描述此技能可以做什么以及何时使用它。
可部署的 Markdown body 应该只包含技能的用途和如何使用它。
Markdown body 仅在技能触发后加载，因此专注于简洁的使用指导和完成任务所需的执行步骤。
在正文中描述操作过程时，不要使用模糊的摘要；提供详细的分步说明，用于精确的操作或执行过程。
在创建组合快捷技能时，总结提供的 SKILL.md 输入的功能目的和结果；不要复制或直接包含其他技能的说明。
仅从源技能和证据中提取必要的操作，例如公式、有序转换、命令、输入、输出和边界条件。
生成的技能的操作部分必须可供未来代理直接使用，无需阅读原始任务记录或源技能。
保持操作说明与审计/来源说明可分离，因为最终部署的 SKILL.md 将不带学习痕迹渲染。"""

