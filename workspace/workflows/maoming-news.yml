name: maoming-news
description: "茂名每日新闻聚合：自动搜索茂名相关关键词新闻，生成 YAML 数据文件并提交推送"

vars:
  project_dir: "/root/.picoclaw/workspace/news"
  data_dir: "/root/.picoclaw/workspace/news/data"
  site_url: "https://ai-news.dtapp.net"

triggers:
  - cron: "0 20 * * *"
    tz: "Asia/Shanghai"

steps:
  # ========== 步骤 1：获取当前日期 ==========
  - id: get_date
    action: tool_call
    tool: get_current_time
    args:
      format: "date"
      timezone: "Asia/Shanghai"
    output_key: today

  # ========== 步骤 2：并行搜索六个关键词的新闻 ==========
  - id: search_news
    action: parallel
    parallel:
      - id: search_maoming
        action: tool_call
        tool: web_search
        args:
          query: "茂名 新闻 {{.get_date.today}}"
          count: 10
          range: "d"
        output_key: results

      - id: search_maonan
        action: tool_call
        tool: web_search
        args:
          query: "茂南 新闻 {{.get_date.today}}"
          count: 10
          range: "d"
        output_key: results

      - id: search_dianbai
        action: tool_call
        tool: web_search
        args:
          query: "电白 新闻 {{.get_date.today}}"
          count: 10
          range: "d"
        output_key: results

      - id: search_huazhou
        action: tool_call
        tool: web_search
        args:
          query: "化州 新闻 {{.get_date.today}}"
          count: 10
          range: "d"
        output_key: results

      - id: search_gaozhou
        action: tool_call
        tool: web_search
        args:
          query: "高州 新闻 {{.get_date.today}}"
          count: 10
          range: "d"
        output_key: results

      - id: search_xinyi
        action: tool_call
        tool: web_search
        args:
          query: "信宜 新闻 {{.get_date.today}}"
          count: 10
          range: "d"
        output_key: results

  # ========== 步骤 3：AI 整理搜索结果、生成/更新 YAML 文件并提交推送 ==========
  - id: compile_and_push
    action: agent_prompt
    prompt: |
      你是茂名新闻编辑助手。今天是 {{.get_date.today}}。

      ⚠️ 严格限制：
      - 项目工作目录为 {{.vars.project_dir}}，所有文件操作必须在该目录下进行
      - 你只能操作 {{.vars.data_dir}}/*.yaml 文件，禁止读取或修改项目中的其他文件（如 Go 代码、HTML 模板、CSS、CI 配置等）
      - 禁止执行生成 HTML 的命令

      ## 搜索结果

      茂名搜索：{{.search_maoming.results}}
      茂南搜索：{{.search_maonan.results}}
      电白搜索：{{.search_dianbai.results}}
      化州搜索：{{.search_huazhou.results}}
      高州搜索：{{.search_gaozhou.results}}
      信宜搜索：{{.search_xinyi.results}}

      ## 执行步骤

      ### 1. 检查是否已存在当天新闻
      今天日期：{{.get_date.today}}
      先使用 read_file 工具读取 {{.vars.data_dir}}/{{.get_date.today}}.yaml 文件：
      - 如果文件不存在：创建新文件（进入步骤 2）
      - 如果文件已存在：读取现有新闻标题，将新搜索到的新闻与已有标题对比去重，追加新新闻到 news 数组中，并重新生成 summary 字段

      ### 2. 创建/更新 YAML 数据文件
      使用 write_file 工具创建或更新 {{.vars.data_dir}}/{{.get_date.today}}.yaml，格式如下：

      ```yaml
      date: "{{.get_date.today}}"
      date_display: "YYYY年M月D日"
      weekday: "星期X"
      news_count: N
      categories:
        - "分类名称"
      news:
        - category: "分类名称"
          title: |
            新闻标题
          summary: |
            新闻摘要内容
          source: "https://example.com/news/xxx"
      summary:
        title: "今日要点"
        points:
          - category: "分类名称"
            content: |
              要点内容简要描述
      data_source: "百度搜索、微博搜索、网络搜索"
      update_time: "YYYY年M月D日 HH时MM分"
      ```

      ### 强制要求（必须遵守）：
      1. **summary 字段必须存在**：根据当天所有新闻内容，生成 3-5 条今日要点，严禁超过 5 条
      2. **每条 summary.points.content 不得超过 50 字**
      3. **YAML 字符串块语法**：所有 title、summary 以及 points 中的 content 字段，必须使用 `|` (Literal Block Scalar) 符号引导
      4. **source 字段**：可选，没有源地址则省略
      5. **update_time 格式**：统一为日期+时间，如：2026年5月6日 20时30分
      6. **data_source 字段必须存在**

      ### 自检步骤（生成后必须执行）：
      - 检查所有 title 和 summary 是否使用了 `|` 语法
      - 检查 summary.points 数量是否在 3-5 条之间
      - 检查每条 summary.points.content 是否超过 50 字
      - 检查 data_source 字段是否存在

      ### 3. 提交推送
      使用 exec 工具在 {{.vars.project_dir}} 目录下依次执行：
      1. git add data/
      2. git commit -m "添加YYYY年M月D日茂名新闻"（替换为实际日期）
      3. git push origin master

      完成后告知用户查看网址：{{.vars.site_url}}
    output_key: result
    timeout: "10m"

config:
  timeout: "15m"
  failure_strategy: stop
